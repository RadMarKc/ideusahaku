services:
  - type: web
    name: ideusahaku
    runtime: docker
    repo: https://github.com/RadMarKc/ideusahaku.git
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://ideusahaku.onrender.com
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: APP_KEY
        generateValue: true